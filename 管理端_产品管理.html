<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国网征信系统 - 产品管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#004B93',
                        secondary: '#0066CC',
                        accent: '#0099FF',
                        success: '#00A854',
                        warning: '#FF9800',
                        danger: '#E53935',
                        neutral: '#F5F7FA',
                        'neutral-dark': '#2C3E50'
                    },
                    fontFamily: {
                        sans: ['Noto Sans SC', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        * {
            font-family: 'Noto Sans SC', sans-serif;
        }
        .hidden {
            display: none !important;
        }
        .sidebar-link {
            transition: all 0.2s ease;
        }
        .sidebar-link:hover {
            background: linear-gradient(90deg, rgba(0,75,147,0.1) 0%, transparent 100%);
        }
        .sidebar-link.active {
            background: linear-gradient(90deg, rgba(0,75,147,0.15) 0%, transparent 100%);
            border-left: 3px solid #004B93;
        }
        .stat-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,75,147,0.15);
        }
        .table-row {
            transition: all 0.2s ease;
        }
        .table-row:hover {
            background-color: rgba(0,75,147,0.03);
        }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="flex h-screen">
        <!-- 左侧边栏 -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col">
            <!-- Logo区域 -->
            <div class="p-6 border-b border-gray-100 bg-gradient-to-r from-primary to-secondary">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center shadow-lg">
                        <i class="fa fa-cog text-primary text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-white font-bold text-lg">国网征信</h1>
                        <p class="text-accent text-xs">管理端</p>
                    </div>
                </div>
            </div>

            <!-- 导航菜单 -->
            <nav class="flex-1 py-6">
                <div class="px-4 mb-4">
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">功能菜单</span>
                </div>
                
                <!-- 运营管理 -->
                <div class="menu-group">
                    <button class="sidebar-link flex items-center justify-between px-6 py-3 active text-gray-700 w-full" onclick="toggleMenu('operation')">
                        <div class="flex items-center">
                            <i class="fa fa-line-chart w-5 text-center mr-3 text-primary"></i>
                            <span class="font-medium">运营管理</span>
                        </div>
                        <i class="fa fa-angle-down text-xs transition-transform" id="operation-icon" style="transform: rotate(180deg);"></i>
                    </button>
                    <div id="operation-submenu" class="submenu">
                        <a href="管理端_金融机构接入.html" class="sidebar-link flex items-center px-6 py-3 text-gray-600 pl-12">
                            <i class="fa fa-plus-circle w-5 text-center mr-3 text-primary"></i>
                            <span class="font-medium">金融机构接入</span>
                        </a>
                        <a href="管理端_产品管理.html" class="sidebar-link active flex items-center px-6 py-3 text-gray-700 pl-12">
                            <i class="fa fa-cubes w-5 text-center mr-3 text-primary"></i>
                            <span class="font-medium">产品管理</span>
                        </a>
                        <a href="管理端_验真地址管理.html" class="sidebar-link flex items-center px-6 py-3 text-gray-600 pl-12">
                            <i class="fa fa-check-circle w-5 text-center mr-3"></i>
                            <span class="font-medium">验真地址管理</span>
                        </a>
                        <a href="管理端_场景管理.html" class="sidebar-link flex items-center px-6 py-3 text-gray-600 pl-12">
                            <i class="fa fa-sitemap w-5 text-center mr-3"></i>
                            <span class="font-medium">场景管理</span>
                        </a>
                        <a href="管理端_投保材料管理.html" class="sidebar-link flex items-center px-6 py-3 text-gray-600 pl-12">
                            <i class="fa fa-file-text-o w-5 text-center mr-3"></i>
                            <span class="font-medium">投保材料管理</span>
                        </a>
                    </div>
                </div>
                
                <!-- 平台管理 -->
                <div class="menu-group">
                    <button class="sidebar-link flex items-center justify-between px-6 py-3 text-gray-600 w-full" onclick="toggleMenu('platform')">
                        <div class="flex items-center">
                            <i class="fa fa-globe w-5 text-center mr-3"></i>
                            <span class="font-medium">平台管理</span>
                        </div>
                        <i class="fa fa-angle-down text-xs transition-transform" id="platform-icon"></i>
                    </button>
                    <div id="platform-submenu" class="submenu hidden">
                        <a href="管理端_省级平台管理.html" class="sidebar-link flex items-center px-6 py-3 text-gray-600 pl-12">
                            <i class="fa fa-globe w-5 text-center mr-3"></i>
                            <span class="font-medium">省级平台管理</span>
                        </a>
                    </div>
                </div>
                
                <!-- 保函管理 -->
                <div class="menu-group">
                    <button class="sidebar-link flex items-center justify-between px-6 py-3 text-gray-600 w-full" onclick="toggleMenu('guarantee')">
                        <div class="flex items-center">
                            <i class="fa fa-shield w-5 text-center mr-3"></i>
                            <span class="font-medium">保函管理</span>
                        </div>
                        <i class="fa fa-angle-down text-xs transition-transform" id="guarantee-icon"></i>
                    </button>
                    <div id="guarantee-submenu" class="submenu hidden">
                        <a href="管理端_保函订单.html" class="sidebar-link flex items-center px-6 py-3 text-gray-600 pl-12">
                            <i class="fa fa-file-text-o w-5 text-center mr-3"></i>
                            <span class="font-medium">保函订单</span>
                        </a>
                        <a href="管理端_保函验真.html" class="sidebar-link flex items-center px-6 py-3 text-gray-600 pl-12">
                            <i class="fa fa-check-circle w-5 text-center mr-3"></i>
                            <span class="font-medium">保函验真</span>
                        </a>
                        <a href="管理端_保函理赔.html" class="sidebar-link flex items-center px-6 py-3 text-gray-600 pl-12">
                            <i class="fa fa-exclamation-circle w-5 text-center mr-3"></i>
                            <span class="font-medium">保函理赔</span>
                        </a>
                        <a href="管理端_保函续保.html" class="sidebar-link flex items-center px-6 py-3 text-gray-600 pl-12">
                            <i class="fa fa-refresh w-5 text-center mr-3"></i>
                            <span class="font-medium">保函续保</span>
                        </a>
                    </div>
                </div>
            </nav>
            <!-- 用户信息 -->
            <div class="p-4 border-t border-gray-100 bg-gray-50">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-primary to-secondary rounded-full flex items-center justify-center text-white font-bold">
                        管
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-gray-900 truncate">系统管理员</p>
                        <p class="text-xs text-gray-500">管理端</p>
                    </div>
                    <button class="text-gray-400 hover:text-gray-600">
                        <i class="fa fa-sign-out"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="flex-1 overflow-y-auto">
            <!-- 顶部导航栏 -->
            <header class="bg-white border-b border-gray-200 px-8 py-4 sticky top-0 z-10">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-xl font-bold text-gray-900">产品管理</h2>
                        <p class="text-sm text-gray-500">欢迎回来，今日是 <span id="today-date" class="font-medium text-primary"></span></p>
                    </div>
                    <div class="flex items-center space-x-4">
                        <button class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-secondary transition-colors" onclick="openAddProductModal()">
                            <i class="fa fa-plus mr-2"></i>新增产品
                        </button>
                        <button class="relative p-2 text-gray-400 hover:text-primary transition-colors">
                            <i class="fa fa-bell-o text-xl"></i>
                            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                        </button>
                        <button class="p-2 text-gray-400 hover:text-primary transition-colors">
                            <i class="fa fa-question-circle-o text-xl"></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- 内容区 -->
            <div class="p-8">
                <!-- 内容区 -->
                <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
                    <!-- 搜索和筛选 -->
                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 mb-6">
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">产品名称</label>
                                <input type="text" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" placeholder="请输入产品名称">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">金融机构</label>
                                <select class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                                    <option value="">全部机构</option>
                                    <option value="ccb">中国建设银行</option>
                                    <option value="icbc">中国工商银行</option>
                                    <option value="cpic">中国太平洋保险</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">产品类型</label>
                                <select class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                                    <option value="">全部类型</option>
                                    <option value="performance">履约保函</option>
                                    <option value="quality">质量（结清款）保函</option>
                                    <option value="advance">预付款保函</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">状态</label>
                                <select class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                                    <option value="">全部状态</option>
                                    <option value="online">已上架</option>
                                    <option value="offline">已下架</option>
                                </select>
                            </div>
                        </div>
                        <div class="flex justify-end mt-4 space-x-3">
                            <button class="px-4 py-2 border border-gray-200 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
                                <i class="fa fa-refresh mr-2"></i>重置
                            </button>
                            <button class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-secondary transition-colors">
                                <i class="fa fa-search mr-2"></i>查询
                            </button>
                        </div>
                    </div>

                    <!-- 产品列表 -->
                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                        <div class="p-6 border-b border-gray-100 flex items-center justify-between">
                            <h3 class="text-lg font-bold text-gray-900 flex items-center">
                                <i class="fa fa-cubes text-primary mr-2"></i>
                                产品列表
                            </h3>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">产品名称</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">金融机构</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">产品类型</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">费率</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white divide-y divide-gray-200">
                                    <tr class="table-row">
                                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">履约保函</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">中国建设银行</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">履约保函</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">0.5%</td>
                                        <td class="px-6 py-4 whitespace-nowrap">
                                            <span class="badge bg-green-100 text-success">已上架</span>
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">
                                            <button class="text-primary hover:text-secondary mr-3" onclick="editProduct('1')">
                                                <i class="fa fa-edit mr-1"></i>编辑
                                            </button>
                                            <button class="text-warning hover:text-yellow-600 mr-3" onclick="viewProduct('1')">
                                                <i class="fa fa-eye mr-1"></i>查看
                                            </button>
                                            <button class="text-danger hover:text-red-600" onclick="offlineProduct('1')">
                                                <i class="fa fa-arrow-down mr-1"></i>下架
                                            </button>
                                        </td>
                                    </tr>
                                    <tr class="table-row">
                                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">质量（结清款）保函</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">中国工商银行</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">质量（结清款）保函</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">0.8%</td>
                                        <td class="px-6 py-4 whitespace-nowrap">
                                            <span class="badge bg-green-100 text-success">已上架</span>
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">
                                            <button class="text-primary hover:text-secondary mr-3" onclick="editProduct('2')">
                                                <i class="fa fa-edit mr-1"></i>编辑
                                            </button>
                                            <button class="text-warning hover:text-yellow-600 mr-3" onclick="viewProduct('2')">
                                                <i class="fa fa-eye mr-1"></i>查看
                                            </button>
                                            <button class="text-danger hover:text-red-600" onclick="offlineProduct('2')">
                                                <i class="fa fa-arrow-down mr-1"></i>下架
                                            </button>
                                        </td>
                                    </tr>
                                    <tr class="table-row">
                                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">预付款保函</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">中国太平洋保险</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">预付款保函</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">1.0%</td>
                                        <td class="px-6 py-4 whitespace-nowrap">
                                            <span class="badge bg-gray-100 text-gray-500">已下架</span>
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">
                                            <button class="text-primary hover:text-secondary mr-3" onclick="editProduct('3')">
                                                <i class="fa fa-edit mr-1"></i>编辑
                                            </button>
                                            <button class="text-warning hover:text-yellow-600 mr-3" onclick="viewProduct('3')">
                                                <i class="fa fa-eye mr-1"></i>查看
                                            </button>
                                            <button class="text-success hover:text-green-600" onclick="onlineProduct('3')">
                                                <i class="fa fa-arrow-up mr-1"></i>上架
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <!-- 分页 -->
                        <div class="px-6 py-4 border-t border-gray-100 flex items-center justify-between">
                            <div class="text-sm text-gray-700">
                                显示 <span class="font-medium">1</span> 到 <span class="font-medium">3</span> 条，共 <span class="font-medium">12</span> 条
                            </div>
                            <div class="flex space-x-2">
                                <button class="px-3 py-1 border border-gray-200 rounded-md text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                                    <i class="fa fa-angle-left"></i>
                                </button>
                                <button class="px-3 py-1 border border-gray-200 rounded-md bg-primary text-white">1</button>
                                <button class="px-3 py-1 border border-gray-200 rounded-md text-gray-700 hover:bg-gray-50">2</button>
                                <button class="px-3 py-1 border border-gray-200 rounded-md text-gray-700 hover:bg-gray-50">3</button>
                                <button class="px-3 py-1 border border-gray-200 rounded-md text-gray-700 hover:bg-gray-50">4</button>
                                <button class="px-3 py-1 border border-gray-200 rounded-md text-gray-700 hover:bg-gray-50">
                                    <i class="fa fa-angle-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 新增产品模态框 -->
    <div id="add-product-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-4xl w-full max-h-[80vh] overflow-y-auto">
            <div class="p-6 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-bold text-gray-900">新增产品</h3>
                <button class="text-gray-400 hover:text-gray-600" onclick="closeAddProductModal()">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6">
                <div class="mb-6">
                    <h4 class="text-md font-bold text-gray-800 mb-4">产品基础信息</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">产品名称 <span class="text-red-500">*</span></label>
                            <input type="text" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" placeholder="请输入产品名称">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">金融机构 <span class="text-red-500">*</span></label>
                            <select class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                                <option value="">请选择金融机构</option>
                                <option value="ccb">中国建设银行</option>
                                <option value="icbc">中国工商银行</option>
                                <option value="cpic">中国太平洋保险</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">产品类型 <span class="text-red-500">*</span></label>
                            <select class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                                <option value="">请选择产品类型</option>
                                <option value="performance">履约保函</option>
                                <option value="quality">质量（结清款）保函</option>
                                <option value="advance">预付款保函</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">费率 <span class="text-red-500">*</span></label>
                            <input type="number" step="0.01" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" placeholder="请输入费率">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">平均时效 <span class="text-red-500">*</span></label>
                            <input type="text" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" placeholder="请输入平均时效，如：3个工作日">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">展业平台 <span class="text-red-500">*</span></label>
                            <select class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                                <option value="">请选择展业平台</option>
                                <option value="platform1">平台A</option>
                                <option value="platform2">平台B</option>
                                <option value="platform3">平台C</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">对接方式 <span class="text-red-500">*</span></label>
                            <select id="add-docking-method" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" onchange="toggleApiUrlField('add')">
                                <option value="">请选择对接方式</option>
                                <option value="api">API对接</option>
                                <option value="manual">人工审核</option>
                            </select>
                        </div>
                        <div id="add-api-url-field" class="hidden">
                            <label class="block text-sm font-medium text-gray-700 mb-2">接口地址 <span class="text-red-500">*</span></label>
                            <input type="url" id="add-api-url" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" placeholder="请输入API接口地址">
                        </div>
                    </div>
                </div>
                

            </div>
            <div class="p-6 border-t border-gray-200 flex justify-end space-x-3">
                <button class="px-4 py-2 border border-gray-200 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors" onclick="closeAddProductModal()">
                    取消
                </button>
                <button class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-secondary transition-colors" onclick="addProduct()">
                    <i class="fa fa-check mr-2"></i>保存
                </button>
            </div>
        </div>
    </div>

    <!-- 编辑金融产品模态框 -->
    <div id="edit-product-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-4xl w-full max-h-[80vh] overflow-y-auto">
            <div class="p-6 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-bold text-gray-900">编辑金融产品</h3>
                <button class="text-gray-400 hover:text-gray-600" onclick="closeEditProductModal()">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6">
                <div class="mb-6">
                    <h4 class="text-md font-bold text-gray-800 mb-4">产品基础信息</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">产品名称 <span class="text-red-500">*</span></label>
                            <input type="text" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" value="履约保函" placeholder="请输入产品名称">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">金融机构 <span class="text-red-500">*</span></label>
                            <select class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                                <option value="ccb" selected>中国建设银行</option>
                                <option value="icbc">中国工商银行</option>
                                <option value="cpic">中国太平洋保险</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">产品类型 <span class="text-red-500">*</span></label>
                            <select class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                                <option value="performance" selected>履约保函</option>
                                <option value="quality">质量（结清款）保函</option>
                                <option value="advance">预付款保函</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">费率 <span class="text-red-500">*</span></label>
                            <input type="number" step="0.01" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" value="0.5" placeholder="请输入费率">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">平均时效 <span class="text-red-500">*</span></label>
                            <input type="text" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" value="3个工作日" placeholder="请输入平均时效，如：3个工作日">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">展业平台 <span class="text-red-500">*</span></label>
                            <select class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                                <option value="">请选择展业平台</option>
                                <option value="platform1">平台A</option>
                                <option value="platform2">平台B</option>
                                <option value="platform3" selected>平台C</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">对接方式 <span class="text-red-500">*</span></label>
                            <select id="edit-docking-method" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" onchange="toggleApiUrlField('edit')">
                                <option value="api" selected>API对接</option>
                                <option value="manual">人工审核</option>
                            </select>
                        </div>
                        <div id="edit-api-url-field">
                            <label class="block text-sm font-medium text-gray-700 mb-2">接口地址 <span class="text-red-500">*</span></label>
                            <input type="url" id="edit-api-url" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" value="https://api.example.com/guarantee" placeholder="请输入API接口地址">
                        </div>
                    </div>
                </div>
            </div>
            <div class="p-6 border-t border-gray-200 flex justify-end space-x-3">
                <button class="px-4 py-2 border border-gray-200 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors" onclick="closeEditProductModal()">
                    取消
                </button>
                <button class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-secondary transition-colors" onclick="updateProduct()">
                    <i class="fa fa-check mr-2"></i>保存
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date();
            const dateStr = today.getFullYear() + '年' + (today.getMonth() + 1) + '月' + today.getDate() + '日';
            document.getElementById('today-date').textContent = dateStr;

            // 点击模态框外部关闭
            const addProductModal = document.getElementById('add-product-modal');
            const editProductModal = document.getElementById('edit-product-modal');

            if (addProductModal) {
                addProductModal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        closeAddProductModal();
                    }
                });
            }

            if (editProductModal) {
                editProductModal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        closeEditProductModal();
                    }
                });
            }
        });

        function toggleMenu(menuId) {
            const submenu = document.getElementById(menuId + '-submenu');
            const icon = document.getElementById(menuId + '-icon');
            
            if (submenu) {
                if (submenu.classList.contains('hidden')) {
                    submenu.classList.remove('hidden');
                    if (icon) icon.style.transform = 'rotate(180deg)';
                } else {
                    submenu.classList.add('hidden');
                    if (icon) icon.style.transform = 'rotate(0deg)';
                }
            }
        }

        function openAddProductModal() {
            document.getElementById('add-product-modal').classList.remove('hidden');
        }

        function toggleApiUrlField(prefix) {
            const select = document.getElementById(prefix + '-docking-method');
            const field = document.getElementById(prefix + '-api-url-field');
            if (select && field) {
                if (select.value === 'api') {
                    field.classList.remove('hidden');
                } else {
                    field.classList.add('hidden');
                }
            }
        }

        function closeAddProductModal() {
            document.getElementById('add-product-modal').classList.add('hidden');
        }

        function addProduct() {
            showNotification('产品添加成功', 'success');
            setTimeout(() => {
                closeAddProductModal();
                location.reload();
            }, 1500);
        }

        function editProduct(id) {
            document.getElementById('edit-product-modal').classList.remove('hidden');
        }

        function closeEditProductModal() {
            document.getElementById('edit-product-modal').classList.add('hidden');
        }

        function updateProduct() {
            showNotification('产品更新成功', 'success');
            setTimeout(() => {
                closeEditProductModal();
                location.reload();
            }, 1500);
        }

        function viewProduct(id) {
            showNotification('查看产品详情', 'info');
        }

        function offlineProduct(id) {
            if (confirm('确定要下架该产品吗？')) {
                showNotification('产品已下架', 'success');
                setTimeout(() => {
                    location.reload();
                }, 1500);
            }
        }

        function onlineProduct(id) {
            if (confirm('确定要上架该产品吗？')) {
                showNotification('产品已上架', 'success');
                setTimeout(() => {
                    location.reload();
                }, 1500);
            }
        }

        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 px-4 py-3 rounded-lg shadow-lg z-50 ${type === 'success' ? 'bg-success text-white' : type === 'error' ? 'bg-danger text-white' : 'bg-primary text-white'}`;
            notification.innerHTML = `
                <div class="flex items-center">
                    <i class="fa ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'} mr-2"></i>
                    <span>${message}</span>
                </div>
            `;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.classList.add('opacity-0', 'transition-opacity', 'duration-500');
                setTimeout(() => notification.remove(), 500);
            }, 3000);
        }
    </script>
</body>
</html>
